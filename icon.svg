<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- メモスケのアプリアイコン（オリジナル）。表紙の地の青一色に、表紙と同じく「メモ」「スケ」の2段 -->
  <!-- 字は端末のフォント（ヒラギノ）で描く。PNG（icon-*.png・apple-touch-icon.png・iOS のアイコン）はこの SVG から作る（CLAUDE.md） -->
  <rect width="1024" height="1024" fill="#3a8fd0"/>
  <g font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-weight="600" font-size="340" fill="#ffffff" text-anchor="middle" letter-spacing="20">
    <text x="512" y="468">メモ</text>
    <text x="512" y="842">スケ</text>
  </g>
</svg>
